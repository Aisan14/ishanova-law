name: Publish static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css redesign.css script.js form-copy.js hero-copy.js form.js privacy.html consent.html favicon.svg hero-office.png robots.txt sitemap.xml _site/
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/redesign.css
          grep -Fq './styles.css' _site/index.html
          grep -Fq './redesign.css' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
